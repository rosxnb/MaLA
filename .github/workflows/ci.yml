name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # libstdc++ ships <mdspan> from GCC 16 on (not 15 — 15 has no such header).
      - name: Install GCC 16 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          echo "CC=gcc-16"  >> $GITHUB_ENV
          echo "CXX=g++-16" >> $GITHUB_ENV

      - name: Verify toolchain has std::mdspan (Linux)
        if: runner.os == 'Linux'
        run: |
          "$CXX" --version
          printf '#include <version>\n#ifndef __cpp_lib_mdspan\n#error no mdspan\n#endif\n' \
            | "$CXX" -std=c++23 -x c++ -fsyntax-only -
          echo "mdspan OK"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMALA_WERROR=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Bench (smoke)
        run: cmake --build build --config Release --target mala_bench

  sanitizers:
    name: asan+ubsan (linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # AddressSanitizer is unusable on current macOS (a libpthread/ASan runtime bug
      # crashes before main), so the ASan gate runs here on Linux where it works.
      - name: Install GCC 16
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          echo "CC=gcc-16"  >> $GITHUB_ENV
          echo "CXX=g++-16" >> $GITHUB_ENV

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j

      - name: Test (sanitized)
        run: ctest --test-dir build --output-on-failure
